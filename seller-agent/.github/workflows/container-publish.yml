name: Publish Containers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable && corepack prepare pnpm@9 --activate
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API image
        run: |
          docker build -f infra/docker/api.Dockerfile -t ghcr.io/${{ github.repository_owner }}/seller-agent-api:${{ github.ref_name }} .
      - name: Build Admin image
        run: |
          docker build -f infra/docker/admin.Dockerfile -t ghcr.io/${{ github.repository_owner }}/seller-agent-admin:${{ github.ref_name }} .
      - name: Push images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/seller-agent-api:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository_owner }}/seller-agent-admin:${{ github.ref_name }}
